services:
  - type: web
    name: thekedar-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install --upgrade pip && pip install -r backend/requirements.txt && python backend/scripts/run_migrations.py"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_JWKS_URL
        sync: false
      - key: SEPOLIA_RPC_URL
        sync: false
      - key: DOCUMENT_REGISTRY_ADDRESS
        sync: false
      - key: SIGNER_PRIVATE_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
