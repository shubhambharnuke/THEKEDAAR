services:
  blockchain:
    build:
      context: .
      dockerfile: contracts/Dockerfile
    container_name: thekedar-blockchain
    ports:
      - "8545:8545"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: thekedar-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite:////app/backend/data/thekedar.db
      - JWT_SECRET_KEY=super-secret-thekedar-dev-key-change-in-prod
      - RSA_PRIVATE_KEY_PATH=/app/backend/storage/keys/private.pem
      - RSA_PUBLIC_KEY_PATH=/app/backend/storage/keys/public.pem
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - SEPOLIA_RPC_URL=http://blockchain:8545
      - BLOCKCHAIN_CHAIN_ID=31337
      - DOCUMENT_REGISTRY_ADDRESS=0x5FbDB2315678afecb367f032d93F642f64180aa3
      - SIGNER_PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    volumes:
      - ./backend:/app/backend
      - backend-data:/app/backend/data
      - backend-storage:/app/backend/storage
    depends_on:
      - blockchain

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: thekedar-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    depends_on:
      - backend

volumes:
  backend-data:
  backend-storage:
