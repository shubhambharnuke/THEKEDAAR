[project]
name = "thekedar-backend"
version = "0.1.0"
description = "FastAPI backend for THEKEDAR College Resource Booking & Permission Management System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg2-binary>=2.9.9",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",
    "web3>=6.20.0",
    "reportlab>=4.2.5",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
