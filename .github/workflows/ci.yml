name: THEKEDAR CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: FastAPI & Core Domain Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest-asyncio

      - name: Run Ruff Lint
        run: |
          pip install ruff
          ruff check backend/

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: "."
          ENVIRONMENT: "test"
          DATABASE_URL: "sqlite:///:memory:"
          SEPOLIA_RPC_URL: "https://rpc.sepolia.org"
        run: |
          pytest -v backend/app/tests/

  contracts-test:
    name: Solidity Smart Contracts & Hardhat Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Compile & Test Hardhat Contracts
        run: npm run test:contracts

  frontend-build:
    name: Next.js Production Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build:web
